name: Build TV APK

on:
  workflow_dispatch:
    inputs:
      aar_tag:
        description: 'AndroidLibXrayLite release tag for libv2ray.aar (empty = latest release)'
        required: false
        type: string
      aar_url:
        description: 'Direct URL to a self-built libv2ray.aar (overrides aar_tag)'
        required: false
        type: string
      release_tag:
        description: 'Also publish the APKs to a GitHub Release for this existing tag (empty = none)'
        required: false
        type: string
  # GitHub combines tags and paths filters with AND, which would silently skip a tag
  # push. Branch pushes stay unrestricted; the release step is gated on the ref instead.
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'V2rayNG/tv/**'
      - 'V2rayNG/settings.gradle.kts'
      - 'V2rayNG/gradle/libs.versions.toml'
      - '.github/workflows/build-tv.yml'

# gh release create / upload needs write access; the build itself only reads.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # No submodules and no NDK: the TV client uses Xray's own tun inbound, so it needs
    # neither hev-socks5-tunnel nor compile-hevtun.sh. The only native input is the AAR.
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    # libv2ray.aar is a generated, replaceable input (AndroidLibXrayLite /
    # AndroidLibV2rayLite gomobile builds). Its manifest declares minSdk 24, so the TV
    # manifest uses tools:overrideLibrary to keep minSdk 21; a rebuilt AAR with a different
    # manifest package needs that override updated too. For Android 5 (API 21/22)
    # libgojni.so must still come from an NDK platform of android-21 or lower, otherwise
    # System.loadLibrary fails at runtime even though the APK builds. Pass such a rebuilt
    # AAR through the aar_url input.
    - name: Fetch libv2ray.aar
      env:
        AAR_URL: ${{ inputs.aar_url || '' }}
        AAR_TAG: ${{ inputs.aar_tag || '' }}
      run: |
        mkdir -p V2rayNG/tv/libs
        if [ -n "$AAR_URL" ]; then
          echo "Using self-built AAR from aar_url"
          curl -fL --retry 3 -o V2rayNG/tv/libs/libv2ray.aar "$AAR_URL"
        elif [ -n "$AAR_TAG" ]; then
          echo "Using AndroidLibXrayLite release tag $AAR_TAG"
          curl -fL --retry 3 -o V2rayNG/tv/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/$AAR_TAG/libv2ray.aar"
        else
          echo "Using latest AndroidLibXrayLite release"
          curl -fL --retry 3 -o V2rayNG/tv/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
        fi

    - name: Verify AAR contains the native core
      run: |
        test -s V2rayNG/tv/libs/libv2ray.aar
        echo "AAR size: $(stat -c%s V2rayNG/tv/libs/libv2ray.aar) bytes"
        echo "AAR manifest declares (minSdk / package):"
        unzip -p V2rayNG/tv/libs/libv2ray.aar AndroidManifest.xml \
          | grep -oE 'android:minSdkVersion="[0-9]+"|package="[^"]*"' \
          || echo "(none)"
        unzip -l V2rayNG/tv/libs/libv2ray.aar | grep 'libgojni.so' || {
          echo "libv2ray.aar contains no libgojni.so; the TV APK could not connect"
          exit 1
        }

    - name: Build TV APKs
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :tv:testDebugUnitTest :tv:lintDebug :tv:assembleDebug --no-daemon --console=plain

    - name: List APK outputs
      run: ls -lh V2rayNG/tv/build/outputs/apk/debug/*.apk

    # A missing AAR still produces APKs (the TV code resolves the core reflectively at
    # runtime), so explicitly assert that the native core was packaged into every shipped
    # artifact. Without this check CI could publish APKs that cannot connect at all.
    - name: Verify native core is packaged
      run: |
        aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -n 1)
        test -x "$aapt2" || { echo "aapt2 not found"; exit 1; }
        for suffix in armeabi-v7a arm64-v8a universal; do
          apk=$(find V2rayNG/tv/build/outputs/apk/debug -name "*_${suffix}.apk" -print -quit)
          if [ -z "$apk" ]; then
            echo "Missing ${suffix} TV APK"
            exit 1
          fi
          echo "== $(basename "$apk") =="
          unzip -l "$apk" | grep 'libgojni.so' || {
            echo "Missing libgojni.so in ${suffix} TV APK"
            exit 1
          }
          "$aapt2" dump badging "$apk" | grep -E "(minSdkVersion|sdkVersion):'21'" > /dev/null || {
            echo "Merged manifest no longer targets minSdk 21 in ${suffix} TV APK"
            exit 1
          }
        done

    # Per-ABI packages are the primary artifacts; universal is the fallback for x86 boxes
    # and for devices whose ABI is unknown.
    - name: Upload armeabi-v7a TV APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: tv-armeabi-v7a
        path: V2rayNG/tv/build/outputs/apk/debug/*armeabi-v7a*.apk
        if-no-files-found: warn

    - name: Upload arm64-v8a TV APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: tv-arm64-v8a
        path: V2rayNG/tv/build/outputs/apk/debug/*arm64-v8a*.apk
        if-no-files-found: warn

    - name: Upload universal TV APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: tv-universal
        path: V2rayNG/tv/build/outputs/apk/debug/*universal*.apk
        if-no-files-found: error

    # Artifacts only live on the Actions run page and expire; a tag push also needs a
    # GitHub Release so the APKs can be downloaded from the Releases page. A manual run
    # with release_tag can backfill a release for a tag that is already pushed.
    - name: Publish TV APKs to GitHub Releases
      if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      run: |
        apks=()
        for suffix in armeabi-v7a arm64-v8a universal; do
          apk=$(find V2rayNG/tv/build/outputs/apk/debug -name "*_${suffix}.apk" -print -quit)
          if [ -z "$apk" ]; then
            echo "Missing ${suffix} TV APK for release"
            exit 1
          fi
          apks+=("$apk")
        done
        if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
          gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
        else
          gh release create "$RELEASE_TAG" "${apks[@]}" --title "$RELEASE_TAG" --generate-notes
        fi
